{% extends 'base.html' %}
{% load crispy_forms_tags  %}

{% block title %}Edit Asset{% endblock %}

{% block content %}
<div class="card narrow">
    <h2>Edit Asset</h2>

    {% if message %}
        <p class="msg">{{ message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Save Changes</button>
        <a class="btn back" href="{% url 'add_asset_page' %}">Back</a>
    </form>
</div>
{% endblock %}
