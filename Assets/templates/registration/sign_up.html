
{% extends 'base.html' %}
{% load crispy_forms_tags  %}


{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="card narrow">
    <h2>Sign Up</h2>

    {% if msg %}
        <p class="msg">{{ msg }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
