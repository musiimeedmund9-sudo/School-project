{% extends 'base.html' %}

{% block title %}Edit Store{% endblock %}

{% block content %}
<div class="card narrow">
    <h2>Edit Store</h2>

    {% if message %}
        <p class="msg">{{ message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Save Changes</button>
        <a class="btn back" href="{% url 'add_store_page' %}">Back</a>
    </form>
</div>
{% endblock %}
