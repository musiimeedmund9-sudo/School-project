{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Assets Management System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css ' %}">
</head>
<body>

    <header>
        <h1>Assets Management System</h1>
        <nav>
            <a href="{% url 'add_employee_page' %}">Employees</a>
            <a href="{% url 'add_store_page' %}">Stores</a>
            <a href="{% url 'add_asset_page' %}">Assets</a>
            <a href="{% url 'add_stock_page' %}">Stock</a>
            <a href="{% url 'add_stock_item_page' %}">Stock Items</a>
            <a href="{% url 'add_requisition_page' %}">Requisitions</a>
            <a href="{% url 'add_requisition_item_page' %}">Requisition Items</a>

            {% if user.is_authenticated %}
                <form method="POST" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit">Logout ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'sign_up_page' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
